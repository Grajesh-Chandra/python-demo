<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <style>
      /* Snackbar CSS */
      #snackbar {
        visibility: hidden;
        min-width: 250px;
        margin-left: -125px;
        background-color: #333;
        color: #fff;
        text-align: center;
        border-radius: 2px;
        padding: 16px;
        position: fixed;
        z-index: 1;
        left: 50%;
        top: 30px;
        font-size: 17px;
      }

      #snackbar.show {
        visibility: visible;
        -webkit-animation: fadein 0.5s, fadeout 0.5s 2.5s;
        animation: fadein 0.5s, fadeout 0.5s 2.5s;
      }

      @-webkit-keyframes fadein {
        from {
          top: 0;
          opacity: 0;
        }
        to {
          top: 30px;
          opacity: 1;
        }
      }

      @keyframes fadein {
        from {
          top: 0;
          opacity: 0;
        }
        to {
          top: 30px;
          opacity: 1;
        }
      }

      @-webkit-keyframes fadeout {
        from {
          top: 30px;
          opacity: 1;
        }
        to {
          top: 0;
          opacity: 0;
        }
      }

      @keyframes fadeout {
        from {
          top: 30px;
          opacity: 1;
        }
        to {
          top: 0;
          opacity: 0;
        }
      }

      /* Add cursor pointer for order-check-icon */
      .order-check-icon {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    {% include 'header.html' %}
    <div class="validation-container">
      <h2>Orders History</h2>

      <div class="filter-container">
        <select class="form-select" id="orderStatusFilter">
          <option value="all">All Orders</option>
          <option value="pending">Pending Orders</option>
          <option value="completed">Completed Orders</option>
        </select>
      </div>

      <table class="table" id="ordersTable">
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Checks</th>
            <th>Consent</th>
            <th>Action</th>
            <th>Digital Link</th>
            <th>Link Status</th>
            <th>SecureTrust PDF</th>
          </tr>
        </thead>
        <tbody id="ordersTableBody"></tbody>
      </table>

      <div class="no-orders" id="noOrdersMessage" style="display: none">
        No orders found matching your criteria.
      </div>

      <div class="text-center">
        <button class="home-button" onclick="window.location.href='/'">
          <i class="fas fa-home"></i> Return Home
        </button>
      </div>
    </div>

    <!-- Modal Dialog Box -->
    <div
      class="modal fade"
      id="statusModal"
      tabindex="-1"
      aria-labelledby="statusModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="statusModalLabel">
              Update Order Status
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <select class="form-select" id="orderStatusSelect">
              <option value="Pending">Pending</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-primary" id="saveStatusButton">
              Save changes
            </button>
          </div>
        </div>
      </div>
    </div>

    <footer>&copy; 2025 Affinidi Private Limited. All rights reserved.</footer>

    <div id="snackbar"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      let selectedOrderId = null;

      function populateTable(orders) {
        const tableBody = document.getElementById("ordersTableBody");
        const noOrdersMessage = document.getElementById("noOrdersMessage");
        const ordersTable = document.getElementById("ordersTable");

        tableBody.innerHTML = "";

        if (orders.length === 0) {
          ordersTable.style.display = "none";
          noOrdersMessage.style.display = "block";
          return;
        } else {
          ordersTable.style.display = "table";
          noOrdersMessage.style.display = "none";
        }

        orders.forEach((order) => {
          const row = tableBody.insertRow();

          // Order ID - Make it a hyperlink
          const orderIdCell = row.insertCell();
          const orderIdLink = document.createElement("a");
          orderIdLink.href = `/order_details/${order.orderId}`; // URL for order details page
          orderIdLink.textContent = order.orderId;
          orderIdLink.classList.add("order-id-link"); // Apply style
          orderIdCell.appendChild(orderIdLink);

          // Checks
          const checksCell = row.insertCell();
          const activeChecks = []; // Array to store active check names

          for (const checkName in order.checks) {
            // Iterate through keys of the checks dictionary
            if (order.checks[checkName] === true) {
              // Check if the value is true
              activeChecks.push(checkName); // Add the check name to the array
            }
          }
          checksCell.textContent = activeChecks.join(", "); // Join the active check names with commas
          checksCell.style.whiteSpace = "normal";

          // Consent
          const consentCell = row.insertCell();
          consentCell.textContent = order.consent ? "Yes" : "No";

          // Action
          const actionCell = row.insertCell();

          // PDF Icon
          const pdfIcon = document.createElement("i");
          pdfIcon.classList.add("fas", "fa-file-pdf", "pdf-icon");
          pdfIcon.title = "View PDF";
          if (order.issuanceState?.status === "VC_CLAIMED") {
            pdfIcon.classList.add("greyed-out");
            pdfIcon.title = "Claimed";
          } else {
            pdfIcon.addEventListener("click", () => {
              window.open("/generate_pdf/" + order.orderId, "_blank");
            });
          }
          actionCell.appendChild(pdfIcon);

          // Separator
          const separator = document.createTextNode(" | ");
          actionCell.appendChild(separator);

          // Order Check Status Icon
          const orderCheckIcon = document.createElement("i");
          if (order.caseStatus === "Pending") {
            orderCheckIcon.classList.add(
              "fas",
              "fa-spinner",
              "order-check-icon"
            );
            orderCheckIcon.title = "Pending";
            orderCheckIcon.style.color = "red"; // Set color to red
          } else if (order.caseStatus === "In Progress") {
            orderCheckIcon.classList.add(
              "fas",
              "fa-hourglass-half",
              "order-check-icon"
            );
            orderCheckIcon.title = "In Progress";
            orderCheckIcon.style.color = "blue"; // Set color to Blue
          } else {
            orderCheckIcon.classList.add(
              "fas",
              "fa-check-circle",
              "order-check-icon"
            );
            orderCheckIcon.title = "Completed";
            orderCheckIcon.style.color = "green"; // Set color to green
            orderCheckIcon.style.cursor = "default"; // Disable cursor pointer
          }

          if (order.caseStatus !== "Completed") {
            orderCheckIcon.addEventListener("click", () => {
              selectedOrderId = order.orderId;
              const orderStatusSelect =
                document.getElementById("orderStatusSelect");
              orderStatusSelect.value = order.caseStatus;
              const statusModal = new bootstrap.Modal(
                document.getElementById("statusModal")
              );
              statusModal.show();
            });
          }
          actionCell.appendChild(orderCheckIcon);

          // Digital Link
          const digitalLinkCell = row.insertCell();
          digitalLinkCell.classList.add("digital-link-cell");
          const link = document.createElement("a");
          if (order.issuanceResponse && order.issuanceResponse.vaultLink) {
            // Check if issuanceResponse and vaultLink exist
            link.href = order.issuanceResponse.vaultLink;
            link.textContent = "View Link";
          } else {
            link.href = "#"; // Or some placeholder if no link
            link.textContent = "Link N/A";
          }
          link.target = "_blank";
          digitalLinkCell.appendChild(link);

          // Link Status
          const linkStatusCell = row.insertCell();
          const statusBadge = document.createElement("span");
          statusBadge.className = `status-badge ${
            order.issuanceState?.status === "VC_CLAIMED" // Use optional chaining
              ? "status-completed"
              : "status-pending"
          }`;
          statusBadge.textContent = order.issuanceState?.status || "N/A"; // Use optional chaining and default value
          linkStatusCell.appendChild(statusBadge);

          // SecureTrust PDF
          const secureTrustCell = row.insertCell();
          const secureTrustIcon = document.createElement("i");
          secureTrustIcon.classList.add("fas", "fa-file-pdf", "pdf-icon");
          secureTrustIcon.title = "SecureTrust Verified";

          if (order.issuanceState?.status === "VC_CLAIMED") {
            secureTrustIcon.addEventListener("click", () => {
              window.open("/generate_secure_pdf/" + order.orderId, "_blank");
            });
          } else {
            secureTrustIcon.classList.add("greyed-out");
            secureTrustIcon.title = "Not Claimed";
          }
          secureTrustCell.appendChild(secureTrustIcon);
        });
      }

      function loadOrders(filter) {
        let url = "/get_orders";
        if (filter !== "all") {
          url += `?status=${filter}`;
        }
        fetch(url)
          .then((response) => response.json())
          .then((orders) => populateTable(orders))
          .catch((error) => console.error("Error fetching orders:", error));
      }

      // Initial load
      loadOrders("all");

      // Filter change handler
      document
        .getElementById("orderStatusFilter")
        .addEventListener("change", function () {
          loadOrders(this.value);
        });

      // Save status button click handler
      document
        .getElementById("saveStatusButton")
        .addEventListener("click", () => {
          const selectedStatus =
            document.getElementById("orderStatusSelect").value;
          fetch(`/update_order/${selectedOrderId}`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ caseStatus: selectedStatus }),
          })
            .then((response) => response.json())
            .then((data) => {
              if (data.success) {
                showSnackbar("Order status updated successfully!");
                const statusModal = bootstrap.Modal.getInstance(
                  document.getElementById("statusModal")
                );
                statusModal.hide();
                loadOrders(document.getElementById("orderStatusFilter").value);
              } else {
                showSnackbar("Error updating order status: " + data.error);
              }
            })
            .catch((error) => {
              console.error("Fetch error:", error);
              showSnackbar("Fetch error occurred. Check console.");
            });
        });

      function showSnackbar(message) {
        const snackbar = document.getElementById("snackbar");
        snackbar.textContent = message;
        snackbar.className = "show";
        setTimeout(() => {
          snackbar.className = snackbar.className.replace("show", "");
        }, 3000);
      }
    </script>
  </body>
</html>
