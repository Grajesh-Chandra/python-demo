<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    {% include 'header.html' %}
    <div class="validation-container">
      <h2>Orders History</h2>

      <div class="filter-container">
        <select class="form-select" id="orderStatusFilter">
          <option value="all">All Orders</option>
          <option value="pending">Pending Orders</option>
          <option value="completed">Completed Orders</option>
        </select>
      </div>

      <table class="table" id="ordersTable">
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Checks</th>
            <th>Consent</th>
            <th>Action</th>
            <th>Digital Link</th>
            <th>Link Status</th>
            <th>SecureTrust PDF</th>
          </tr>
        </thead>
        <tbody id="ordersTableBody"></tbody>
      </table>

      <div class="no-orders" id="noOrdersMessage" style="display: none">
        No orders found matching your criteria.
      </div>

      <div class="text-center">
        <button class="home-button" onclick="window.location.href='/'">
          <i class="fas fa-home"></i> Return Home
        </button>
      </div>
    </div>

    <footer>&copy; 2025 Affinidi Private Limited. All rights reserved.</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      function populateTable(orders) {
        const tableBody = document.getElementById("ordersTableBody");
        const noOrdersMessage = document.getElementById("noOrdersMessage");
        const ordersTable = document.getElementById("ordersTable");

        tableBody.innerHTML = "";

        if (orders.length === 0) {
          ordersTable.style.display = "none";
          noOrdersMessage.style.display = "block";
          return;
        } else {
          ordersTable.style.display = "table";
          noOrdersMessage.style.display = "none";
        }

        orders.forEach((order) => {
          const row = tableBody.insertRow();

          // Order ID - Make it a hyperlink
          const orderIdCell = row.insertCell();
          const orderIdLink = document.createElement("a");
          orderIdLink.href = `/order_details/${order.orderId}`; // URL for order details page
          orderIdLink.textContent = order.orderId;
          orderIdLink.classList.add("order-id-link"); // Apply style
          orderIdCell.appendChild(orderIdLink);

          // Checks
          const checksCell = row.insertCell();
          const activeChecks = []; // Array to store active check names

          for (const checkName in order.checks) {
            // Iterate through keys of the checks dictionary
            if (order.checks[checkName] === true) {
              // Check if the value is true
              activeChecks.push(checkName); // Add the check name to the array
            }
          }
          checksCell.textContent = activeChecks.join(", "); // Join the active check names with commas
          checksCell.style.whiteSpace = "normal";

          // Consent
          const consentCell = row.insertCell();
          consentCell.textContent = order.consent ? "Yes" : "No";

          // Action
          const actionCell = row.insertCell();
          const pdfIcon = document.createElement("i");
          pdfIcon.classList.add("fas", "fa-file-pdf", "pdf-icon");
          pdfIcon.title = "View PDF";

          if (order.issuanceState?.status === "VC_CLAIMED") {
            pdfIcon.classList.add("greyed-out");
            pdfIcon.title = "Claimed";
          } else {
            pdfIcon.addEventListener("click", () => {
              window.open("/generate_pdf/" + order.orderId, "_blank");
            });
          }
          actionCell.appendChild(pdfIcon);

          // Digital Link
          const digitalLinkCell = row.insertCell();
          digitalLinkCell.classList.add("digital-link-cell");
          const link = document.createElement("a");
          if (order.issuanceResponse && order.issuanceResponse.vaultLink) {
            // Check if issuanceResponse and vaultLink exist
            link.href = order.issuanceResponse.vaultLink;
            link.textContent = "View Link";
          } else {
            link.href = "#"; // Or some placeholder if no link
            link.textContent = "Link N/A";
          }
          link.target = "_blank";
          digitalLinkCell.appendChild(link);

          // Link Status
          const linkStatusCell = row.insertCell();
          const statusBadge = document.createElement("span");
          statusBadge.className = `status-badge ${
            order.issuanceState?.status === "VC_CLAIMED" // Use optional chaining
              ? "status-completed"
              : "status-pending"
          }`;
          statusBadge.textContent = order.issuanceState?.status || "N/A"; // Use optional chaining and default value
          linkStatusCell.appendChild(statusBadge);

          // SecureTrust PDF
          const secureTrustCell = row.insertCell();
          const secureTrustIcon = document.createElement("i");
          secureTrustIcon.classList.add("fas", "fa-file-pdf", "pdf-icon");
          secureTrustIcon.title = "SecureTrust Verified";

          if (order.issuanceState?.status === "VC_CLAIMED") {
            secureTrustIcon.addEventListener("click", () => {
              window.open("/generate_secure_pdf/" + order.orderId, "_blank");
            });
          } else {
            secureTrustIcon.classList.add("greyed-out");
            secureTrustIcon.title = "Not Claimed";
          }
          secureTrustCell.appendChild(secureTrustIcon);
        });
      }

      function loadOrders(filter) {
        let url = "/get_orders";
        if (filter !== "all") {
          url += `?status=${filter}`;
        }
        fetch(url)
          .then((response) => response.json())
          .then((orders) => populateTable(orders))
          .catch((error) => console.error("Error fetching orders:", error));
      }

      // Initial load
      loadOrders("all");

      // Filter change handler
      document
        .getElementById("orderStatusFilter")
        .addEventListener("change", function () {
          loadOrders(this.value);
        });
    </script>
  </body>
</html>
