<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Interface</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <style>
      /* Styles copied and adapted from case.html */
      body {
        background-color: #f8f9fb;
        font-family: "Segoe UI", system-ui, sans-serif;
        display: flex; /* Added for footer positioning */
        flex-direction: column; /* Added for footer positioning */
        min-height: 100vh; /* Added for footer positioning */
      }

      .navbar {
        background-color: #fff;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        flex-shrink: 0; /* Prevent navbar from shrinking */
      }

      .navbar-nav .nav-link {
        color: #3f51b5;
        font-weight: 500;
        margin: 0 1rem;
        transition: all 0.2s ease;
      }

      .navbar-nav .nav-link:hover,
      .navbar-nav .nav-link.active {
        color: #1a237e;
        transform: translateY(-1px);
      }

      /* Applied validation-container style to the main chat container */
      .chat-wrapper {
        width: 80vw;
        max-width: 800px;
        min-width: 400px;
        margin: 2rem auto;
        padding: 2rem;
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
        flex-grow: 1; /* Allow chat wrapper to grow */
        overflow: hidden; /* Prevent content spill */
      }

      @media (max-width: 768px) {
        .chat-wrapper {
          width: 95vw;
          min-width: unset;
          padding: 1.5rem;
          margin: 1rem auto;
        }
      }

      /* Style for the chat header */
      .chat-header h1 {
        color: #1a237e;
        font-weight: 600;
        margin-bottom: 1.5rem;
        text-align: center;
        font-size: 1.75rem; /* Adjusted size slightly */
      }

      /* Styles for the message area */
      .message-area {
        flex-grow: 1;       /* Allows this area to expand and take available vertical space */
        overflow-y: auto;
        padding: 1rem;
        border: 1px solid #e0e0e0; /* Subtle border */
        border-radius: 8px;
        margin-bottom: 1.5rem;
        background-color: #f8f9fa; /* Light background for contrast */
      }

      /* Basic message styling */
      .message {
        margin-bottom: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        max-width: 80%;
        word-wrap: break-word; /* Prevent long words from overflowing */
      }

      .user-message {
        background-color: #e3f2fd; /* Light blue for user */
        color: #1a237e;
        margin-left: auto; /* Align user messages to the right */
        text-align: right;
      }

      .bot-message {
        background-color: #f1f3f5; /* Light grey for bot */
        color:rgb(240, 49, 49);
        margin-right: auto; /* Align bot messages to the left */
        text-align: left;
      }

      .message-user {
        font-weight: bold;
        display: block;
        font-size: 0.8rem;
        margin-bottom: 0.25rem;
        color: #555;
      }

      .message-text {
        margin-bottom: 0.25rem;
        font-size: 0.95rem;
        line-height: 1.4;
      }

      .message-time {
        font-size: 0.75rem;
        color: #777;
        display: block;
        margin-top: 0.25rem;
      }


      /* Styles for the input area */
      .chat-input-area {
         /* Removed position: sticky and bottom: 0 */
         padding-top: 1rem; /* Add some space above the input */
         border-top: 1px solid #e0e0e0; /* Separator line */
         background-color: #fff; /* Match container background */
         margin: 0 -2rem -2rem -2rem; /* Extend to container edges */
         padding: 1rem 2rem; /* Add padding back */
         border-bottom-left-radius: 12px; /* Match container radius */
         border-bottom-right-radius: 12px; /* Match container radius */
      }
       @media (max-width: 768px) {
        .chat-input-area {
            margin: 0 -1.5rem -1.5rem -1.5rem; /* Adjust for smaller padding */
            padding: 1rem 1.5rem;
        }
       }


      .message-form {
        display: flex;
        gap: 0.75rem;
        align-items: center;
      }

      /* Style for the text input based on case.html inputs */
      #message-input {
        flex-grow: 1;
        padding: 0.75rem;
        border: 2px solid #c5cae9;
        border-radius: 6px;
        transition: all 0.2s ease;
      }

      #message-input:focus {
        border-color: #3f51b5;
        box-shadow: 0 0 0 2px rgba(63, 81, 181, 0.2);
        outline: none;
      }

      /* Style for the send button based on case.html buttons */
      #send-button {
        padding: 0.75rem 1.5rem; /* Adjusted padding slightly */
        border-radius: 6px;
        font-weight: 500;
        transition: all 0.2s ease;
        background-color: #3f51b5; /* Using the primary theme color */
        border: none;
        color: white;
        flex-shrink: 0; /* Prevent button from shrinking */
      }

      #send-button:hover {
        background-color: #303f9f;
        transform: translateY(-1px);
      }

       #send-button:disabled {
         background-color: #9fa8da; /* Lighter color when disabled */
         cursor: not-allowed;
       }

      /* Footer styling from case.html */
      footer.page-footer { /* Added class to distinguish from chat input footer */
        background-color: #f8f9fb;
        color: #666;
        text-align: center;
        padding: 1rem;
        margin-top: auto; /* Pushes footer to bottom */
        font-size: 0.9rem;
        width: 100%; /* Ensure footer spans full width */
        flex-shrink: 0; /* Prevent footer from shrinking */
      }
    </style>
  </head>
  <body>
    {% include 'header.html' %}

    <div class="chat-wrapper">
      <header class="chat-header">
        <h1>Ask Me Anything</h1>
      </header>

      <main id="message-area" class="message-area">
        </main>

      <footer class="chat-input-area">
        <form id="message-form" class="message-form">
          <input
            type="text"
            id="message-input"
            class="form-control" /* Bootstrap class might conflict, removed if using custom styles fully */
            placeholder="Type your message here..."
            autocomplete="off"
          />
          <button type="submit" id="send-button" class="btn">Send</button> </form>
      </footer>
    </div>

    <footer class="page-footer">&copy; 2025 Affinidi Private Limited. All rights reserved.</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // Your existing JavaScript remains the same
      document.addEventListener("DOMContentLoaded", () => {
        const messageArea = document.getElementById("message-area");
        const messageForm = document.getElementById("message-form");
        const messageInput = document.getElementById("message-input");
        const sendButton = document.getElementById("send-button");

        function scrollToBottom() {
          messageArea.scrollTop = messageArea.scrollHeight;
        }

        function addMessageToChat(messageData) {
          const messageDiv = document.createElement("div");
          messageDiv.classList.add("message");

          if (messageData.type === "user") {
            messageDiv.classList.add("user-message");
          } else {
            messageDiv.classList.add("bot-message");
          }

          // Format timestamp consistently
          const timestamp = new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
          });

          // Use innerHTML carefully, ensure escapeHTML is robust if needed
          messageDiv.innerHTML = `
              <span class="message-user">${escapeHTML(messageData.user)}</span>
              <p class="message-text">${escapeHTML(messageData.text)}</p>
              <span class="message-time">${timestamp}</span>
          `; // Updated to use consistent timestamp

          messageArea.appendChild(messageDiv);
          scrollToBottom();
        }

        function escapeHTML(str) {
            if (typeof str !== 'string') return ''; // Handle non-string input
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        messageForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const messageText = messageInput.value.trim();

          if (messageText === "") {
            return;
          }

          messageInput.value = "";
          messageInput.focus();
          sendButton.disabled = true; // Disable button

           // Add user's message immediately for better UX
           const userMessageData = {
                user: "You", // Or dynamically set user name
                text: messageText,
                type: "user" // Use 'type' for styling
            };
           addMessageToChat(userMessageData);


          const formData = new FormData();
          formData.append("message", messageText);

          fetch("/send_message", {
            method: "POST",
            body: formData,
          })
            .then((response) => {
              if (!response.ok) {
                return response.json().then((err) => {
                  throw new Error(err.message || "Network response was not ok");
                });
              }
              return response.json();
            })
            .then((data) => {
              if (data.status === "success") {
                // User message already added, only add bot response
                // addMessageToChat(data.user_message); // Redundant now
                if (data.bot_message) {
                    // Add bot message type for styling
                    data.bot_message.type = "bot";
                    // Optionally add a small delay for the bot response
                     setTimeout(() => {
                         addMessageToChat(data.bot_message);
                     }, 300); // 300ms delay looks more natural
                }
              } else {
                console.error("Error sending message:", data.message);
                addMessageToChat({
                  user: "System",
                  text: `Error: ${escapeHTML(data.message || "Could not send message.")}`,
                   type: "bot",
                });
              }
            })
            .catch((error) => {
              console.error("Fetch error:", error);
              addMessageToChat({
                user: "System",
                text: `Error: ${escapeHTML(error.message || "Could not connect to server.")}`,
                 type: "bot",
              });
            })
            .finally(() => {
              sendButton.disabled = false; // Re-enable button
               messageInput.focus(); // Keep focus on input
            });
        });

        scrollToBottom();
        messageInput.focus();
      });
    </script>
  </body>
</html>
