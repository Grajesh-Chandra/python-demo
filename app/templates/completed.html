<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credentials Claimed</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fb;
        font-family: "Segoe UI", system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .validation-container {
        width: 80vw;
        max-width: 1200px;
        min-width: 400px;
        margin: 2rem auto;
        padding: 2rem;
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
        text-align: center; /* Center align text and button */
      }

      @media (max-width: 768px) {
        .validation-container {
          width: 95vw;
          min-width: unset;
          padding: 1.5rem;
        }
      }

      .navbar {
        background-color: #fff;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }

      .navbar-nav .nav-link {
        color: #3f51b5;
        font-weight: 500;
        margin: 0 1rem;
        transition: all 0.2s ease;
      }

      .navbar-nav .nav-link:hover,
      .navbar-nav .nav-link.active {
        color: #1a237e;
        transform: translateY(-1px);
      }

      .card-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1.5rem;
        margin: 2rem 0;
      }

      .card {
        border: none;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        transition: transform 0.2s ease;
      }

      .card:hover {
        transform: translateY(-3px);
      }

      .card-title {
        color: #1a237e;
        font-weight: 600;
        margin-bottom: 1rem;
      }

      .card-body {
        padding: 1.5rem;
      }

      .status-badge {
        padding: 0.5rem 1rem;
        border-radius: 20px;
        font-weight: 500;
      }

      .status-green {
        background-color: #e8f5e9;
        color: #2e7d32;
      }

      .status-red {
        background-color: #ffebee;
        color: #d32f2f;
      }

      .btn-primary {
        background-color: #3f51b5;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 6px;
        transition: all 0.2s ease;
      }

      .btn-primary:hover {
        background-color: #303f9f;
        transform: translateY(-1px);
      }

      h1.display-4 {
        color: #1a237e;
        font-weight: 600;
        margin-bottom: 1.5rem;
      }

      .lead {
        color: #666;
        font-size: 1.1rem;
        line-height: 1.6;
        max-width: 800px;
        margin: 0 auto 2rem auto;
      }

      footer {
        background-color: #f8f9fb;
        color: #666;
        text-align: center;
        padding: 1rem;
        margin-top: auto;
        font-size: 0.9rem;
      }
    </style>
  </head>

  <body>
    <div class="validation-container">
      <h1 class="display-4">Credentials Claimed</h1>
      <p class="lead">
        You have claimed your credentials, you can now close this popup/browser.
      </p>
      <button class="btn btn-primary" onclick="window.close();">
        Close Window
      </button>
    </div>

    <footer>&copy; 2025 Affinidi Private Limited. All rights reserved.</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
